# LitePan 统一开发入口：所有构建、测试、镜像命令都由这里管理。
# 版本固定在项目级，禁止改全局配置。

[tools]
node = "24"
go = "1.27.2"
pnpm = "12.10.1"

[env]
# 仓库不依赖 go.work，避免本机工具链互相干扰
GOWORK = "off"
# 前端依赖装在 web/，把它的二进制目录加进 PATH，任务可直接调用 vite、vue-tsc
_.path = ["{{config_root}}/web/node_modules/.bin"]

# ---------- 前端（依赖装在 web/，命令一律在 web/ 下跑） ----------

# 所有前端任务共享的配置：切到 web/。PATH 由上面的 [env] _.path 提供。
[task_templates."web"]
dir = "web"

[tasks."web:install"]
description = "安装前端依赖"
extends = "web"
run = "pnpm install"

[tasks."web:dev"]
description = "启动前端开发服务器（/api 代理到后端）"
extends = "web"
run = "vite"
env = { LITEPAN_API_PROXY = "http://127.0.0.1:5211" }

[tasks."web:type-check"]
description = "前端类型检查"
extends = "web"
run = "vue-tsc -b"

[tasks."web:build"]
description = "构建前端产物到 internal/api/web（内嵌目录）"
extends = "web"
depends = ["web:type-check"]
run = "vite build && node scripts/compress-build.mjs"

[tasks."web:placeholder"]
description = "未构建前端时生成占位页，保证 go:embed 有文件可嵌入"
extends = "web"
run = "mkdir -p ../internal/api/web && { [ -f ../internal/api/web/index.html ] || cp build/placeholder.html ../internal/api/web/index.html; }"

[tasks."web:test"]
description = "运行前端测试脚本"
extends = "web"
run = "node scripts/test-upload-dispatcher.mjs && node scripts/test-upload-task-tree.mjs"

# ---------- 后端 ----------
# 内嵌目录不入库，未构建前端时靠 web:placeholder 生成的占位页编译；
# 因此所有 Go 侧任务都依赖该任务。

[tasks."lint:install"]
description = "安装 golangci-lint"
run = "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0"

[tasks.lint]
description = "运行 golangci-lint"
depends = ["web:placeholder"]
run = "golangci-lint run -c .golangci.yml ./..."

[tasks.test]
description = "运行后端测试（含竞态检测）"
depends = ["web:placeholder"]
run = "go test -race ./..."

[tasks.build]
description = "构建后端（fuse 标签）"
depends = ["web:placeholder"]
run = "go build -tags fuse ./..."

[tasks."build:nofuse"]
description = "构建后端（无 fuse 标签）"
depends = ["web:placeholder"]
run = "go build ./..."

# ---------- 本地开发 ----------

[tasks."test:scanflow"]
description = "扫描流程的端到端集成测试（独立于日常单测；基线固化在 /tmp/strmforge-e2e/baseline）"
# 只清空库与工作素材，保留 baseline/ —— 基线固化后每次运行直接复用。
# go test 的工作目录是包目录，素材路径必须给绝对路径。
run = "rm -rf /tmp/strmforge-e2e/empty.db /tmp/strmforge-e2e/work-corpus && mkdir -p /tmp/strmforge-e2e && STRMFORGE_E2E_DB=/tmp/strmforge-e2e/empty.db STRMFORGE_E2E_CORPUS=$(pwd)/tests/rel go test -tags=integration -count=1 -v -timeout=20m ./internal/strmforge/ -run TestStrmForgeScanFlow"

[tasks."test:scanflow:rebuild"]
description = "强制重建集成测试的基线库"
run = "STRMFORGE_E2E_REBUILD=1 mise run test:scanflow"

[tasks."dev:seed"]
description = "准备 tests/ 测试数据（假媒体文件、数据库、管理员口令、本地目录账号）"
run = "go run ./tools/devseed -root ."

[tasks."dev:run"]
description = "本地启动服务（端口 5211；数据都在 tests/ 下）"
depends = ["web:placeholder", "dev:seed"]
run = "go run ./cmd/litepan"
env = { LITEPAN_DATA_DIR = "tests/data", LITEPAN_LISTEN = ":5211", LITEPAN_LOG_LEVEL = "debug" }

# ---------- 镜像 ----------

[tasks."docker:build"]
description = "构建 Docker 镜像（先本地构建前端，镜像直接内嵌）"
depends = ["web:placeholder", "web:build"]
# 镜像名写全 docker.io/：podman 不会给含 registry 的名字补 localhost/ 前缀，
# docker compose 归一化后也是这个名字，两端对齐就不用再补 tag。
run = "mkdir -p dist && docker build --platform linux/amd64 --build-arg GO_VERSION={{tools.go.version}} --build-arg NODE_VERSION={{tools.node.version}} -t docker.io/yxlimo/litepan-strmforge:dev ."

[tasks."docker:up"]
description = "docker compose 起服务"
run = "docker compose up -d --build"

[tasks."docker:down"]
description = "docker compose 停服务"
run = "docker compose down"
